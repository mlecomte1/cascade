[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade"
version = "0.2.0"
description = "Offline desktop decoder for encodings, ciphers, and light deobfuscation"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "pycryptodome>=3.20.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
packaging = ["pyinstaller>=6.0.0"]

[project.scripts]
cascade = "cascade.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
