      <text x="640" y="162" text-anchor="middle" fill="#8ab8bc" font-size="14">Session only · pas de base</text>
    </g>
    <g>
      <rect x="854" y="36" width="390" height="148" rx="20" fill="#1a0a10" stroke="#6e3038"/>
      <text x="1049" y="98" text-anchor="middle" fill="#ff6a45" font-size="22" font-weight="800" letter-spacing="4">ONE-WAY</text>
